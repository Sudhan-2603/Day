<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day - Emotions & Outfits</title>
    <style>
      :root {
        --bg: #0f1219;
        --card-bg: #161c28;
        --card-border: #232c3d;
        --text: #f1f5f9;
        --text-dim: #94a3b8;
        --accent: #ff9e40;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      .nav-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 960px;
        margin: 0 auto 32px;
        padding: 12px 20px;
        background: rgba(22, 28, 40, 0.7);
        border: 1px solid var(--card-border);
        border-radius: 9999px;
        backdrop-filter: blur(16px);
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.15rem;
        color: #ffa734;
      }
      .nav-links {
        display: flex;
        gap: 16px;
      }
      .nav-link {
        color: var(--text-dim);
        text-decoration: none;
        font-size: 0.9rem;
        padding: 6px 14px;
        border-radius: 999px;
        transition: all 0.2s ease;
      }
      .nav-link:hover, .nav-link.active {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
      }
      .section-title {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 32px 0 16px;
        color: #f8fafc;
        letter-spacing: -0.01em;
      }
      .character-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
      }
      @media (max-width: 820px) {
        .character-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 460px) {
        .character-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .character-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 16px 8px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        user-select: none;
      }
      .character-card:hover {
        transform: translateY(-3px);
        border-color: rgba(255, 167, 52, 0.4);
        box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 167, 52, 0.15);
      }
      .character-card:active {
        transform: translateY(0) scale(0.97);
      }
      .card-avatar-circle {
        position: relative;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 175, 60, 0.28) 0%, rgba(35, 20, 16, 0.45) 60%, rgba(12, 14, 20, 0.85) 100%);
        border: 2px solid rgba(255, 165, 50, 0.55);
        box-shadow: 0 0 16px rgba(255, 120, 20, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .character-card:hover .card-avatar-circle {
        border-color: rgba(255, 185, 80, 0.85);
        box-shadow: 0 0 24px rgba(255, 140, 30, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        transform: scale(1.05);
      }
      .character-card canvas {
        display: block;
      }
      .card-label {
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--text-dim);
        font-weight: 500;
      }
      .character-card:hover .card-label {
        color: var(--text);
      }
      .hero-avatar-section {
        display: flex;
        justify-content: center;
        margin: 10px 0 32px;
      }
      .circle-avatar-container {
        display: flex;
        align-items: center;
        gap: 24px;
        background: linear-gradient(135deg, rgba(32, 24, 20, 0.6) 0%, rgba(20, 24, 36, 0.7) 100%);
        border: 1px solid rgba(255, 167, 52, 0.3);
        border-radius: 28px;
        padding: 20px 32px;
        box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 150, 40, 0.12);
      }
      .circle-avatar-frame {
        position: relative;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 175, 60, 0.28) 0%, rgba(35, 20, 16, 0.45) 60%, rgba(12, 14, 20, 0.85) 100%);
        border: 2px solid rgba(255, 165, 50, 0.5);
        box-shadow: 0 0 20px rgba(255, 130, 30, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .avatar-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .avatar-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffb14a;
        letter-spacing: -0.01em;
      }
      .avatar-desc {
        font-size: 0.9rem;
        color: var(--text-dim);
        max-width: 380px;
        line-height: 1.4;
      }
    </style>
    <script type="module" crossorigin src="/assets/day-Dwm3tn9J.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/bridge-6ofyamVr.js">
    <link rel="modulepreload" crossorigin href="/assets/engine-CY-_2ojC.js">
  </head>
  <body>
    <header class="nav-bar">
      <div class="nav-brand">
        <span>Day</span>
      </div>
      <nav class="nav-links">
        <a class="nav-link active" href="/day.html">Emotions & Outfits</a>
        <a class="nav-link" href="/index.html">Capsule Island</a>
        <a class="nav-link" href="/settings.html">Settings</a>
      </nav>
    </header>

    <main class="container">
      <div class="hero-avatar-section">
        <div class="circle-avatar-container">
          <div class="circle-avatar-frame">
            <canvas id="circle-avatar-canvas"></canvas>
          </div>
          <div class="avatar-info">
            <div class="avatar-title">Day Bot Avatar in Circle</div>
            <div class="avatar-desc">Creamy custard to glowing warm amber silhouette with anime specular iris reflections & blushing cheek marks</div>
          </div>
        </div>
      </div>

      <h2 class="section-title">Expressions</h2>
      <div id="expressions-grid" class="character-grid"></div>

      <h2 class="section-title">Outfits</h2>
      <div id="outfits-grid" class="character-grid"></div>
    </main>

  </body>
</html>
